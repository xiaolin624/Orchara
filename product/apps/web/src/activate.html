<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>开启你的工作空间 · Orchara</title>
<style>
    input, textarea { width: 100%; box-sizing: border-box; margin-top: .2rem; padding: .4rem .5rem; font: inherit; }
  </style>
<link href="/assets/design.css" rel="stylesheet"/>
</head>
<body data-auth="optional" data-page="activate"><div class="auth-layout"><aside class="auth-story"><a class="brand" aria-label="Orchara 对话工作区" href="/chat"><span class="brand-mark"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M7 4h10l5 8-5 8H7l-5-8 5-8Z" stroke="currentColor" stroke-width="1.8"></path><path d="m7 4 5 8-5 8m10-16-5 8 5 8M2 12h20" stroke="currentColor" stroke-width="1.5"></path></svg></span><span class="brand-name">Orchara</span></a><div class="auth-story-copy"><p class="eyebrow">IDEAS INTO WORKFLOWS</p><h2>让想法成为<br/>可运行的工作流。</h2><p>连接模型、工具与知识，<br/>构建属于团队的 Agent 应用。</p></div><small>ORCHARA · 团队 Agent 工作空间</small><div class="auth-art" aria-hidden="true"></div>
</aside>
<div class="auth-main"><div class="auth-mobile-brand"><a class="brand" aria-label="Orchara 对话工作区" href="/chat"><span class="brand-mark"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M7 4h10l5 8-5 8H7l-5-8 5-8Z" stroke="currentColor" stroke-width="1.8"></path><path d="m7 4 5 8-5 8m10-16-5 8 5 8M2 12h20" stroke="currentColor" stroke-width="1.5"></path></svg></span><span class="brand-name">Orchara</span></a></div>
<main class="page-content" id="main-content" tabindex="-1">
<header class="page-heading"><div><p class="eyebrow" data-icon="user">GET STARTED</p><h1>开启你的工作空间</h1><p class="page-description">使用管理员提供的邀请令牌，设置密码并激活账号。</p></div></header>
<div class="page-sections">
<section class="card">
<form id="activate-form" method="post">
<label for="activation-token">一次性激活令牌
        <textarea id="activation-token" name="activation_token" autocomplete="off" required="" rows="3"></textarea>
</label>
<label for="password">新密码（至少 12 位）
        <input id="password" name="password" autocomplete="new-password" minlength="12" required="" type="password"/>
</label>
<label for="confirm-password">确认新密码
        <input id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="12" required="" type="password"/>
</label>
<button type="submit">激活并设置密码</button>
</form>
<p class="status" id="activate-status" aria-live="polite" role="status"></p>
<div id="activate-success" hidden="">
<p>激活成功，现在可以前往 <a href="/admin">管理台</a> 登录。</p>
</div>
</section>
</div><nav aria-label="账号导航" data-static-navigation="true"><a href="/login">登录账号</a><a href="/activate">激活账号</a><a href="/chat">返回工作空间</a></nav>
<details class="usage-notes"><summary>使用说明与技术详情</summary><p class="sub">
    把管理员转交的一次性令牌粘贴到下面，设置至少 12 位的新密码。
    令牌只从请求体提交，绝不放进 URL。
  </p></details></main>
</div></div><script src="/assets/ui.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/nav.js"></script>
<script>
    const activateForm = document.getElementById('activate-form');
    const activateStatus = document.getElementById('activate-status');
    const activateSuccess = document.getElementById('activate-success');
    const activationTokenField = document.getElementById('activation-token');
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm-password');

    function setStatus(message, kind) {
      activateStatus.textContent = message;
      activateStatus.className = 'status ' + (kind || '');
    }

    activateForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      // The token is read from the textarea, never from the address bar: a
      // one-time credential must not appear in a URL or a browser history entry.
      const activationToken = activationTokenField.value.trim();
      const password = passwordField.value;
      if (password !== confirmField.value) {
        setStatus('两次输入的密码不一致', 'bad');
        return;
      }
      setStatus('正在激活…', 'pending');
      try {
        await api('/api/v1/auth/activate', {
          method: 'POST',
          body: { activation_token: activationToken, password },
        });
        activationTokenField.value = '';
        passwordField.value = '';
        confirmField.value = '';
        activateForm.hidden = true;
        activateSuccess.hidden = false;
        setStatus('激活成功', 'ok');
      } catch (error) {
        setStatus(`激活失败 [${error.code}] ${error.message}`, 'bad');
      }
    });
  </script>
</body>
</html>
