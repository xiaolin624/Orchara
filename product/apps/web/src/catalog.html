<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchara 授权用途目录（F08/T077）</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 2rem; line-height: 1.55; max-width: 52rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    .sub { opacity: .7; font-size: .88rem; margin-bottom: 1.25rem; }
    nav a { margin-right: 1rem; }
    .card { border: 1px solid rgba(128,128,128,.35); border-radius: .6rem; padding: 1rem 1.1rem; margin-bottom: 1rem; }
    ul { padding-left: 0; margin: .4rem 0 0; list-style: none; }
    li { border-top: 1px solid rgba(128,128,128,.25); padding: .7rem 0; }
    li:first-child { border-top: 0; }
    code { font-size: .82rem; opacity: .85; }
    .status { min-height: 1.4rem; font-size: .88rem; margin: .6rem 0 0; }
    .status.ok { color: #15803d; }
    .status.bad { color: #b91c1c; }
    .status.pending { color: #a16207; }
    .hint { font-size: .82rem; opacity: .7; }
    .badge { display: inline-block; font-size: .78rem; border-radius: 999px; padding: .05rem .6rem; border: 1px solid currentColor; }
    .badge.fallback { color: #a16207; }
    .badge.index { color: #15803d; }
    .card-purpose { font-weight: 600; margin: .1rem 0 .3rem; }
    .facts { font-size: .86rem; opacity: .85; margin: .15rem 0; }
    .facts strong { opacity: .95; }
    button { margin-top: .6rem; padding: .45rem 1rem; font: inherit; cursor: pointer; }
    input[type="search"] { font: inherit; padding: .4rem .55rem; width: 18rem; max-width: 100%; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav>
    <a href="/">状态</a>
    <a href="/apps">应用目录（创作）</a>
    <a href="/catalog">用途目录检索</a>
    <a href="/chat">会话</a>
    <a href="/runs">运行</a>
  </nav>

  <h1>授权用途目录（F08/T077）</h1>
  <p class="sub">
    只显示<strong>你当前有权读取且未撤销</strong>的已发布版本；每条结果都带用途、边界、
    必填输入、预期输出和示例。目录索引是权威表的投影：索引落后时本页会明确显示
    “回退检索（索引落后）”，改在授权范围内做全文检索，并在返回前再次核对授权与撤销。
  </p>

  <section class="card">
    <h2>检索用途</h2>
    <form id="catalog-search-form" method="get">
      <label for="catalog-query">按用途/能力描述检索</label>
      <input id="catalog-query" name="q" type="search" maxlength="200" autocomplete="off"
             placeholder="例如：销售报表汇总" />
      <button id="catalog-search-submit" type="submit">检索</button>
    </form>
    <p id="catalog-retrieval" class="hint" role="status" aria-live="polite"></p>
    <p id="catalog-status" class="status" role="status" aria-live="polite">正在加载…</p>
  </section>

  <section class="card">
    <h2>可读版本</h2>
    <p id="catalog-count" class="hint"></p>
    <ul id="catalog-results" data-auth-content></ul>
    <p id="catalog-empty" class="hint" hidden></p>
    <button id="catalog-next" type="button" hidden>下一页</button>
  </section>

  <p class="hint">
    目录索引与知识库索引是两套表、两套重建路径：本页的重建只读
    <code>application_versions</code> 的能力卡，不读写 <code>knowledge_chunks</code>。
    “用这个版本提交”会带上版本 id 进入会话页；路由与澄清属于 T079。
  </p>

  <script src="/assets/app.js"></script>
  <script src="/assets/nav.js"></script>
  <script src="/assets/catalog.js"></script>
  <script>
    const form = document.getElementById('catalog-search-form');
    const queryInput = document.getElementById('catalog-query');
    const statusElement = document.getElementById('catalog-status');
    const retrievalElement = document.getElementById('catalog-retrieval');
    const countElement = document.getElementById('catalog-count');
    const resultsElement = document.getElementById('catalog-results');
    const emptyElement = document.getElementById('catalog-empty');
    const nextButton = document.getElementById('catalog-next');

    let query = '';
    let nextCursor = null;

    function setStatus(message, kind) {
      statusElement.textContent = message;
      statusElement.className = 'status ' + (kind || '');
    }

    function fact(label, values) {
      if (!values || values.length === 0) {
        return null;
      }
      const line = document.createElement('p');
      line.className = 'facts';
      const strong = document.createElement('strong');
      strong.textContent = label + '：';
      line.appendChild(strong);
      line.appendChild(document.createTextNode(values.join('；')));
      return line;
    }

    function renderRetrieval(retrieval) {
      const described = describeRetrieval(retrieval);
      const badge = document.createElement('span');
      badge.className = 'badge ' + (described.source === 'fallback' ? 'fallback' : 'index');
      badge.textContent = described.label;
      retrievalElement.replaceChildren(
        badge,
        document.createTextNode(' ' + described.explanation
          + '（已复核 ' + described.rechecked + ' 条，拒绝 ' + described.rejectedByRecheck + ' 条）'),
      );
    }

    // Every node is built with textContent: card text is user/creator data and is
    // never parsed as markup.
    function renderItem(item) {
      const described = describeCatalogHit(item);
      const entry = document.createElement('li');
      const title = document.createElement('p');
      title.className = 'card-purpose';
      const name = document.createElement('strong');
      name.textContent = described.title;
      title.appendChild(name);
      const version = document.createElement('code');
      version.textContent = ' ' + described.versionID;
      title.appendChild(version);
      entry.appendChild(title);

      const purpose = document.createElement('p');
      purpose.className = 'facts';
      purpose.textContent = '用途：' + (described.purpose || '（未填写用途）');
      entry.appendChild(purpose);
      for (const [label, values] of [
        ['包含', described.includes],
        ['不包含', described.excludes],
        ['必填输入', described.requiredInputs],
        ['预期输出', described.expectedOutputs],
        ['示例', described.examples],
      ]) {
        const line = fact(label, values);
        if (line) {
          entry.appendChild(line);
        }
      }

      const useLink = document.createElement('a');
      useLink.href = catalogSubmitTarget(item);
      useLink.textContent = '用这个版本提交 →';
      entry.appendChild(useLink);
      resultsElement.appendChild(entry);
    }

    async function loadPage(cursor) {
      setStatus('正在检索…', 'pending');
      resultsElement.replaceChildren();
      try {
        await requireLogin();
        const page = await api(catalogSearchPath(query, cursor));
        const items = page.items || [];
        for (const item of items) {
          renderItem(item);
        }
        nextCursor = page.next_cursor || null;
        nextButton.hidden = !nextCursor;
        const retrieval = page.retrieval || {};
        renderRetrieval(retrieval);
        const count = items.length;
        countElement.textContent = describeCatalogCount(count, Boolean(nextCursor));
        const emptyText = describeCatalogEmpty(retrieval, count);
        emptyElement.textContent = emptyText;
        emptyElement.hidden = !emptyText;
        setStatus(count === 0 ? '没有可显示的版本。' : '检索完成。', 'ok');
      } catch (error) {
        if (error.status === 401) {
          window.location.assign('/login');
          return;
        }
        setStatus('检索失败 [' + error.code + '] ' + error.message, 'bad');
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      query = queryInput.value;
      loadPage(null);
    });

    nextButton.addEventListener('click', () => {
      if (nextCursor) {
        loadPage(nextCursor);
      }
    });

    loadPage(null);
  </script>
</body>
</html>
