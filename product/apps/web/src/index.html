<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>平台状态 · Orchara</title>
<style>
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-width: 60rem; }
    .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
    .value { font-size: 1.5rem; font-weight: 600; margin-top: .35rem; }
    .ok { color: #15803d; }
    .bad { color: #b91c1c; }
    .warn { color: #a16207; }
  </style>
<link href="/assets/design.css" rel="stylesheet"/>
</head>
<body data-auth="optional" data-page="index"><a class="skip-link" href="#main-content">跳转到主要内容</a><aside class="app-sidebar" id="app-sidebar" aria-label="工作空间导航"><a class="brand" aria-label="Orchara 对话工作区" href="/chat"><span class="brand-mark"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M7 4h10l5 8-5 8H7l-5-8 5-8Z" stroke="currentColor" stroke-width="1.8"></path><path d="m7 4 5 8-5 8m10-16-5 8 5 8M2 12h20" stroke="currentColor" stroke-width="1.5"></path></svg></span><span class="brand-name">Orchara</span></a><div class="workspace-label"><span class="workspace-dot"></span>团队工作空间</div><nav aria-label="主导航" data-orchara-nav="true"><a href="/chat">会话</a><a href="/login">登录</a></nav>
<div class="sidebar-footer"><span class="account-avatar" data-icon="user"></span><span class="account-copy"><span id="account-label">正在读取身份</span><small id="account-role">Orchara Workspace</small></span></div>
</aside>
<button class="nav-scrim" id="nav-scrim" aria-label="关闭导航" type="button"></button><div class="app-workspace"><div class="workspace-bar"><button class="icon-button" id="sidebar-toggle" aria-controls="app-sidebar" aria-expanded="true" aria-label="收起侧边导航" data-icon="panel" type="button"></button><div class="breadcrumb"><span>管理</span><span class="separator">/</span><span>平台状态</span></div><span class="workspace-note">ORCHARA WORKSPACE</span></div>
<main class="page-content" id="main-content" tabindex="-1">
<header class="page-heading"><div><p class="eyebrow" data-icon="pulse">SYSTEM STATUS</p><h1>平台状态</h1><p class="page-description">查看平台进程、依赖与当前运行环境的实际状态。</p></div><div class="heading-actions"><a href="/chat">前往对话</a></div></header>
<details class="usage-notes"><summary>使用说明与技术详情</summary><p class="sub">
    这是 F00 骨架页面：显示真实进程与依赖状态，<strong>不是</strong>业务功能。
    数据来自 <code>/api/status</code>，每 3 秒刷新。
  </p></details><div class="page-sections">
<div class="grid">
<div class="card">
<div class="label">存活 (liveness)</div>
<div class="value" id="live">…</div>
<div class="label" style="margin-top:.6rem">版本</div>
<div id="version">…</div>
</div>
<div class="card">
<div class="label">就绪 (readiness)</div>
<div class="value" id="ready">…</div>
<div class="label" style="margin-top:.6rem">已运行</div>
<div id="uptime">…</div>
</div>
<div class="card">
<div class="label">依赖检查</div>
<ul id="checks"><li>…</li></ul>
</div>
<div class="card">
<div class="label">环境 profile</div>
<div class="value" id="environment-profile">…</div>
<div class="label" style="margin-top:.6rem">结果标记</div>
<div class="warn" id="environment-stub">…</div>
</div>
</div>
<p class="sub" id="stamp" style="margin-top:1.5rem"></p>
</div></main>
</div><script src="/assets/ui.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/nav.js"></script>
<script>
    const liveEl = document.getElementById('live');
    const readyEl = document.getElementById('ready');
    const versionEl = document.getElementById('version');
    const uptimeEl = document.getElementById('uptime');
    const checksEl = document.getElementById('checks');
    const stampEl = document.getElementById('stamp');
    const profileEl = document.getElementById('environment-profile');
    const stubEl = document.getElementById('environment-stub');

    function formatUptime(seconds) {
      if (typeof seconds !== 'number') return '…';
      const m = Math.floor(seconds / 60);
      return m > 0 ? `${m} 分 ${seconds % 60} 秒` : `${seconds} 秒`;
    }

    async function refresh() {
      try {
        // Liveness comes from its own endpoint: never assume the process is alive
        // just because this fetch reached the server.
        const live = await (await fetch('/health/live', { cache: 'no-store' })).json();
        liveEl.textContent = live.status === 'alive' ? '运行中' : (live.status ?? '未知');
        liveEl.className = 'value ' + (live.status === 'alive' ? 'ok' : 'bad');
        versionEl.textContent = live.version ?? '…';
        uptimeEl.textContent = formatUptime(live.uptime_seconds);

        const status = await (await fetch('/api/status', { cache: 'no-store' })).json();
        const ready = status.status === 'ready';
        readyEl.textContent = ready ? '就绪' : '未就绪';
        readyEl.className = 'value ' + (ready ? 'ok' : 'bad');

        // F15A/T057: a stub environment must be identifiable from the page itself,
        // not only from the report. Values come from /api/status; nothing is guessed.
        const profileName = status.profile ?? '';
        profileEl.textContent = profileName || '未声明';
        profileEl.className = 'value ' + (profileName ? '' : 'warn');
        const stubResults = status.stub_results === true;
        stubEl.textContent = stubResults ? 'stub 结果（非真实模型）' : '真实结果';
        stubEl.className = 'value ' + (stubResults ? 'warn' : 'ok');

        checksEl.innerHTML = '';
        for (const [name, result] of Object.entries(status.checks ?? {})) {
          const li = document.createElement('li');
          li.textContent = `${name}: ${result.status}`;
          li.className = result.status === 'ok' ? 'ok' : (result.status === 'not_configured' ? 'warn' : 'bad');
          checksEl.appendChild(li);
        }
        stampEl.textContent = '最后更新：' + new Date().toLocaleTimeString();
      } catch (err) {
        liveEl.textContent = '无法连接';
        liveEl.className = 'value bad';
        readyEl.textContent = '未知';
        readyEl.className = 'value warn';
        stampEl.textContent = '请求失败：' + err;
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
